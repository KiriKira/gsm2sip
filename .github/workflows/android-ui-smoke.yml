name: Android KVM UI smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android-ui-smoke.yml'
      - 'scripts/android-ui-smoke.py'

permissions:
  contents: read

jobs:
  gateway-ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build debug APK
        run: |
          mkdir -p artifacts/android-ui-smoke
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee artifacts/android-ui-smoke/apk.sha256

      - name: Install and exercise the gateway app on a foldable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: 7.6in Foldable
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 360
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            python3 scripts/android-ui-smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --package com.callagent.gateway --scenario gateway --device-profile '7.6in Foldable' --artifact-dir artifacts/android-ui-smoke

      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-gateway-android-ui-smoke
          path: |
            artifacts/android-ui-smoke/**
            app/build/outputs/apk/debug/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
