name: Gateway signed releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after the signed build passes
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: Verify and build signed Android artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}
      publish: ${{ steps.release_metadata.outputs.publish }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      name: ${{ steps.release_metadata.outputs.name }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
      sign_release: ${{ steps.release_metadata.outputs.sign_release }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Compute immutable release identity
        id: release_metadata
        shell: bash
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA:0:7}"
          version_code=$((10000 + GITHUB_RUN_NUMBER))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Computed Android versionCode is outside the supported range 1..2100000000."
            exit 1
          fi

          sign_release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable release tags must use vMAJOR.MINOR.PATCH."
              exit 1
            fi
            sign_release=true
            version_name="$tag"
            release_name="$tag"
            prerelease=false
          else
            tag="build-${GITHUB_RUN_NUMBER}-${sha7}"
            version_name="1.4.0-${tag}"
            release_name="$tag"
            prerelease=true
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              sign_release=true
            fi
          fi

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/main" && "${PUBLISH_INPUT,,}" == "true" ]]; then
              publish=true
            fi
          elif [[ "$sign_release" == true ]]; then
            publish=true
          fi

          {
            echo "GSM_RELEASE_VERSION_CODE=$version_code"
            echo "GSM_RELEASE_VERSION_NAME=$version_name"
          } >> "$GITHUB_ENV"
          artifact_name="gateway-release-${GITHUB_RUN_NUMBER}-${sha7}"
          validation_artifact_name="gateway-validation-${GITHUB_RUN_NUMBER}-${sha7}"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "tag=$tag"
            echo "name=$release_name"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "sign_release=$sign_release"
            echo "sha7=$sha7"
            echo "artifact_name=$artifact_name"
            echo "validation_artifact_name=$validation_artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Require fixed release key and certificate pin
        if: steps.release_metadata.outputs.sign_release == 'true'
        shell: bash
        env:
          GSM_RELEASE_KEYSTORE_BASE64: ${{ secrets.GSM_RELEASE_KEYSTORE_BASE64 }}
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in GSM_RELEASE_KEYSTORE_BASE64 GSM_RELEASE_STORE_PASSWORD GSM_RELEASE_KEY_ALIAS GSM_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done
          pin="${GSM_RELEASE_CERT_SHA256//:/}"
          pin="${pin,,}"
          if [[ ! "$pin" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Repository variable GSM_RELEASE_CERT_SHA256 must be the fixed release certificate SHA-256 fingerprint."
            exit 1
          fi

          keystore="$RUNNER_TEMP/gsm2sip-release-signing.jks"
          printf '%s' "$GSM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "::error::GSM_RELEASE_KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          fi
          actual="$(keytool -exportcert -keystore "$keystore" \
            -storepass:env GSM_RELEASE_STORE_PASSWORD -alias "$GSM_RELEASE_KEY_ALIAS" \
            | sha256sum | awk '{print tolower($1)}')"
          if [[ "$actual" != "$pin" ]]; then
            echo "::error::Configured keystore certificate does not match GSM_RELEASE_CERT_SHA256."
            exit 1
          fi
          echo "GSM_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go for optional tinymix ABI builds
        if: steps.release_metadata.outputs.sign_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests and lint
        if: steps.release_metadata.outputs.sign_release == 'true'
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Run release tooling tests
        if: steps.release_metadata.outputs.sign_release == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'

      - name: Lint non-main validation build
        if: steps.release_metadata.outputs.sign_release != 'true'
        run: bash gradlew :app:lintDebug --no-daemon

      - name: Verify Magisk scripts
        run: |
          set -euo pipefail
          bash -n build.sh tools/check-device.sh magisk/install.sh magisk/service.sh magisk/post-fs-data.sh magisk/bin/gsm2sipctl
          sh tools/test-magisk-runtime.sh

      - name: Set release version in Magisk module metadata
        shell: bash
        env:
          VERSION_NAME: ${{ steps.release_metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("magisk/module.prop")
          text = path.read_text(encoding="utf-8")
          for key, value in (("version", os.environ["VERSION_NAME"]),
                             ("versionCode", os.environ["VERSION_CODE"])):
              pattern = rf"(?m)^{key}=.*$"
              text, count = re.subn(pattern, f"{key}={value}", text)
              if count != 1:
                  raise SystemExit(f"expected exactly one {key}= entry in magisk/module.prop")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build the signed release APK and Magisk module
        if: steps.release_metadata.outputs.sign_release == 'true'
        env:
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
        run: SKIP_INSTALL=1 bash build.sh release

      - name: Build non-main validation APK and Magisk module
        if: steps.release_metadata.outputs.sign_release != 'true'
        run: SKIP_INSTALL=1 bash build.sh debug

      - name: Verify release signature, package metadata, alignment and Magisk payload
        if: steps.release_metadata.outputs.sign_release == 'true'
        env:
          ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_metadata.outputs.name }}
          RELEASE_PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        run: python3 scripts/verify-release-artifacts.py

      - name: Add the publisher tool beside the release payload
        if: steps.release_metadata.outputs.sign_release == 'true'
        run: |
          set -euo pipefail
          test -f scripts/publish-github-release.py
          mkdir -p release-artifact/tools
          cp scripts/publish-github-release.py release-artifact/tools/publish-github-release.py

      - name: Upload verified release payload
        if: steps.release_metadata.outputs.sign_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload non-main validation artifacts
        if: steps.release_metadata.outputs.sign_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_metadata.outputs.validation_artifact_name }}
          path: |
            gateway.apk
            gateway-magisk.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish immutable GitHub Release
    needs: build
    if: >-
      needs.build.outputs.publish == 'true' &&
      (
        (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && inputs.publish == true)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified release payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      - name: Publish without replacing existing releases or assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_NAME: ${{ needs.build.outputs.name }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            --directory release-artifact/payload
            --tag "$RELEASE_TAG"
            --commit "$GITHUB_SHA"
            --name "$RELEASE_NAME"
          )
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          python3 release-artifact/tools/publish-github-release.py "${args[@]}"
