name: Gateway checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_debug:
        description: Build a debuggable APK with the permanent release signing identity for this validation branch
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - run: bash -n build.sh tools/check-device.sh magisk/install.sh magisk/service.sh
      - run: sh tools/test-magisk-runtime.sh
      - run: SKIP_INSTALL=1 bash build.sh debug
      - name: Record debug build identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          info = json.loads(Path('debug-batch.json').read_text())
          info.update(source_commit=os.environ['GITHUB_SHA'], run_url=os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          info['sha256'] = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app/build/outputs/apk/debug').glob('*.apk')}
          if Path('gateway-magisk.zip').exists():
              info['sha256']['gateway-magisk.zip'] = hashlib.sha256(Path('gateway-magisk.zip').read_bytes()).hexdigest()
          Path('BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-development-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gateway-magisk.zip
            BUILD-INFO.json
            DEBUG-BATCH.md
          if-no-files-found: error

  webrtc-probe:
    name: Isolated synthetic WebRTC probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 -m unittest discover -s probes/webrtc/tools -p 'test_*.py'
      - run: bash gradlew -p probes/webrtc assembleDebug testDebugUnitTest --no-daemon --max-workers=2
      - name: Hash probe APK and record source
        run: |
          sha256sum probes/webrtc/build/outputs/apk/debug/*.apk > probes/webrtc/build/SHA256SUMS
          git rev-parse HEAD > probes/webrtc/build/SOURCE-COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: webrtc-synthetic-probe
          path: |
            probes/webrtc/build/outputs/apk/debug/*.apk
            probes/webrtc/build/webrtc-sdk/provenance.json
            probes/webrtc/build/test-results/testDebugUnitTest/
            probes/webrtc/build/SHA256SUMS
            probes/webrtc/build/SOURCE-COMMIT
            probes/webrtc/README.md
          if-no-files-found: error

  signed-debug:
    name: Permanent-key signed debug APK
    if: github.event_name == 'workflow_dispatch' && inputs.signed_debug == true && github.ref == 'refs/heads/ci/webrtc-sip-debug-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assign an installable validation version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((10000 + GITHUB_RUN_NUMBER))
          if (( version_code > 2100000000 )); then
            echo '::error::Android versionCode is outside the supported range.'
            exit 1
          fi
          {
            echo "GSM_RELEASE_VERSION_CODE=$version_code"
            echo "GSM_RELEASE_VERSION_NAME=1.4.0-debug-build-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"
      - name: Run gateway tests and build debuggable APK plus Magisk module
        run: |
          set -euo pipefail
          bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
          bash -n build.sh tools/check-device.sh magisk/install.sh magisk/service.sh magisk/post-fs-data.sh magisk/bin/gsm2sipctl
          sh tools/test-magisk-runtime.sh
          SKIP_INSTALL=1 bash build.sh debug
      - name: Decode the configured permanent signing key and check its pin
        shell: bash
        env:
          GSM_RELEASE_KEYSTORE_BASE64: ${{ secrets.GSM_RELEASE_KEYSTORE_BASE64 }}
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in GSM_RELEASE_KEYSTORE_BASE64 GSM_RELEASE_STORE_PASSWORD GSM_RELEASE_KEY_ALIAS GSM_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done
          pin="${GSM_RELEASE_CERT_SHA256//:/}"
          pin="${pin,,}"
          if [[ ! "$pin" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::GSM_RELEASE_CERT_SHA256 must be a 64-hex SHA-256 fingerprint.'
            exit 1
          fi
          keystore="$RUNNER_TEMP/gsm2sip-release-signing.jks"
          printf '%s' "$GSM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env GSM_RELEASE_STORE_PASSWORD -alias "$GSM_RELEASE_KEY_ALIAS" | sha256sum | awk '{print tolower($1)}')"
          if [[ "$actual" != "$pin" ]]; then
            echo '::error::Configured keystore does not match the permanent release certificate pin.'
            exit 1
          fi
          echo "GSM_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Sign APK with the permanent key and verify package signature
        shell: bash
        env:
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign \
            --ks "$GSM_RELEASE_STORE_FILE" \
            --ks-key-alias "$GSM_RELEASE_KEY_ALIAS" \
            --ks-pass env:GSM_RELEASE_STORE_PASSWORD \
            --key-pass env:GSM_RELEASE_KEY_PASSWORD \
            --out gateway-debug-signed.apk gateway.apk
          "$tools/apksigner" verify --verbose --print-certs gateway-debug-signed.apk > signature.txt
          cat signature.txt
          expected="${GSM_RELEASE_CERT_SHA256//:/}"
          expected="${expected,,}"
          actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2); exit }' signature.txt)"
          [[ "$actual" == "$expected" ]] || { echo '::error::APK certificate does not match the permanent release certificate pin.'; exit 1; }
          "$tools/aapt" dump badging gateway-debug-signed.apk > badging.txt
          grep -qx 'application-debuggable' badging.txt
          mv gateway-debug-signed.apk gateway-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("gateway-magisk.zip")
          apk = Path("gateway-debug.apk").read_bytes()
          replacement = "system/priv-app/Gateway/Gateway.apk"
          temporary = archive.with_suffix(".signed.zip")
          with ZipFile(archive, "r") as source:
              matches = [item for item in source.infolist() if item.filename == replacement]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {replacement} entry, found {len(matches)}")
              with ZipFile(temporary, "w") as target:
                  for item in source.infolist():
                      target.writestr(item, apk if item.filename == replacement else source.read(item.filename))
          temporary.replace(archive)
          with ZipFile(archive) as check:
              if check.read(replacement) != apk:
                  raise SystemExit("Magisk module APK does not match the permanently signed debug APK")
          PY
          sha256sum gateway-debug.apk gateway-magisk.zip > SHA256SUMS.txt
          cat > BUILD-REPORT.md <<EOF
          # Gateway signed debug build

          Source: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Android variant: debuggable, version ${GSM_RELEASE_VERSION_NAME} (${GSM_RELEASE_VERSION_CODE})
          APK signing certificate SHA-256: ${expected}
          APK SHA-256: $(sha256sum gateway-debug.apk | awk '{print $1}')
          Magisk module embeds this exact APK: verified
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-permanent-key-signed-debug
          path: |
            gateway-debug.apk
            gateway-magisk.zip
            SHA256SUMS.txt
            BUILD-REPORT.md
          if-no-files-found: error
          retention-days: 14
